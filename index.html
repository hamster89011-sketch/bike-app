<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        /* 기본 스타일에 필요한 리셋 및 다크모드 전역 스타일 지정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 헤더 섹션 */
        header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #333333;
            padding-bottom: 20px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 샘플 데이터 표시 배지 */
        .sample-badge {
            background-color: #ff9800;
            color: #000000;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }

        /* 정보 및 컨트롤 바 */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .update-time {
            font-size: 0.85rem;
            color: #888888;
        }

        .btn-refresh {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-refresh:hover {
            background-color: #2a2a2a;
            border-color: #555555;
        }

        .btn-refresh:active {
            transform: scale(0.98);
        }

        /* 통계 요약 카드 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-title {
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-value.cyan {
            color: #38bdf8; /* 하늘색 */
        }

        .stat-value.red {
            color: #ef4444; /* 빨간색 */
        }

        /* 대여소 목록 스타일 */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .station-card {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .station-card:hover {
            border-color: #444444;
            transform: translateY(-2px);
        }

        /* 자전거가 0대인 곳 스타일 */
        .station-card.empty {
            border: 1px solid #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .station-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            word-break: keep-all;
            line-height: 1.3;
        }

        .station-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 5px;
        }

        .count-group {
            display: flex;
            flex-direction: column;
        }

        .count-label {
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 2px;
        }

        .count-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        /* 사용 가능한 자전거 수는 하늘색 표시 */
        .count-value.cyan {
            color: #38bdf8;
        }

        /* 자전거가 0대인 곳은 빨간색 표시 */
        .count-value.red {
            color: #ef4444;
        }

        .meta-group {
            text-align: right;
            font-size: 0.8rem;
            color: #aaaaaa;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* 빈 결과 처리 */
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #777777;
            background-color: #121212;
            border-radius: 12px;
            border: 1px solid #222222;
        }

        /* 로딩 스피너 */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 헤더 및 컨트롤 영역 -->
        <header>
            <div class="title-row">
                <h1>
                    <span>🚲 서울 따릉이 현황</span>
                    <span id="sampleBadge" class="sample-badge">샘플 데이터</span>
                </h1>
                <div class="action-group">
                    <span id="updateTime" class="update-time">갱신 시각: -</span>
                    <button id="btnRefresh" class="btn-refresh" title="데이터 새로고침">
                        🔄 새로고침
                    </button>
                </div>
            </div>

            <div class="control-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="대여소 이름 검색 (예: 망원역, 합정역)" />
                </div>
            </div>
        </header>

        <!-- 전체 요약 정보 -->
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-title">총 검색 대여소</span>
                <span id="statTotalStations" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">대여 가능 자전거</span>
                <span id="statTotalBikes" class="stat-value cyan">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">대여 불가 대여소 (0대)</span>
                <span id="statEmptyStations" class="stat-value red">0</span>
            </div>
        </div>

        <!-- 대여소 목록 카드 그리드 -->
        <div id="stationGrid" class="station-grid">
            <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        // 네트워크 실패 시 사용될 기본 샘플 데이터
        const SAMPLE_DATA = {
            "rentBikeStatus": {
                "list_total_count": 5,
                "RESULT": {
                    "CODE": "INFO-000",
                    "MESSAGE": "정상 처리되었습니다."
                },
                "row": [
                    {
                        "rackTotCnt": "15",
                        "stationName": "102. 망원역 1번출구 앞",
                        "parkingBikeTotCnt": "11",
                        "shared": "73",
                        "stationLatitude": "37.55564880",
                        "stationLongitude": "126.91062927",
                        "stationId": "ST-4"
                    },
                    {
                        "rackTotCnt": "14",
                        "stationName": "103. 망원역 2번출구 앞",
                        "parkingBikeTotCnt": "12",
                        "shared": "86",
                        "stationLatitude": "37.55495071",
                        "stationLongitude": "126.91083527",
                        "stationId": "ST-5"
                    },
                    {
                        "rackTotCnt": "13",
                        "stationName": "104. 합정역 1번출구 앞",
                        "parkingBikeTotCnt": "16",
                        "shared": "123",
                        "stationLatitude": "37.55073929",
                        "stationLongitude": "126.91508484",
                        "stationId": "ST-6"
                    },
                    {
                        "rackTotCnt": "5",
                        "stationName": "105. 합정역 5번출구 앞",
                        "parkingBikeTotCnt": "0",
                        "shared": "0",
                        "stationLatitude": "37.55000687",
                        "stationLongitude": "126.91482544",
                        "stationId": "ST-7"
                    },
                    {
                        "rackTotCnt": "12",
                        "stationName": "106. 합정역 7번출구 앞",
                        "parkingBikeTotCnt": "1",
                        "shared": "8",
                        "stationLatitude": "37.54864502",
                        "stationLongitude": "126.91282654",
                        "stationId": "ST-8"
                    }
                ]
            }
        };

        // 애플리케이션 상태
        let rawStations = [];
        let isSampleMode = false;

        // DOM 요소 참조
        const stationGrid = document.getElementById('stationGrid');
        const searchInput = document.getElementById('searchInput');
        const updateTimeEl = document.getElementById('updateTime');
        const sampleBadge = document.getElementById('sampleBadge');
        const btnRefresh = document.getElementById('btnRefresh');

        const statTotalStations = document.getElementById('statTotalStations');
        const statTotalBikes = document.getElementById('statTotalBikes');
        const statEmptyStations = document.getElementById('statEmptyStations');

        // 데이터 파싱 함수 (문자열 값을 숫자로 변환)
        function parseStationData(rowArray) {
            if (!Array.isArray(rowArray)) return [];

            return rowArray.map(item => ({
                stationName: item.stationName || '알 수 없음',
                parkingBikeTotCnt: Number(item.parkingBikeTotCnt) || 0,
                rackTotCnt: Number(item.rackTotCnt) || 0,
                shared: Number(item.shared) || 0,
                stationId: item.stationId || ''
            }));
        }

        // 따릉이 데이터 가져오기
        async function fetchBikeData() {
            stationGrid.innerHTML = '<div class="loading">데이터를 불러오는 중입니다...</div>';

            try {
                const response = await fetch('/api/bike');
                if (!response.ok) {
                    throw new Error(`HTTP 에러: ${response.status}`);
                }
                const data = await response.json();
                
                if (!data?.rentBikeStatus?.row) {
                    throw new Error('올바르지 않은 응답 데이터 구조입니다.');
                }

                // 정상 로드 완료
                rawStations = parseStationData(data.rentBikeStatus.row);
                isSampleMode = false;
            } catch (error) {
                console.warn('API 호출 실패. 샘플 데이터를 표시합니다.', error);
                
                // 샘플 데이터 사용
                rawStations = parseStationData(SAMPLE_DATA.rentBikeStatus.row);
                isSampleMode = true;
            } finally {
                updateUIState();
                renderStations();
            }
        }

        // UI 상태 업데이트 (시간, 샘플 배지 등)
        function updateUIState() {
            // 샘플 배지 표시 여부
            if (isSampleMode) {
                sampleBadge.style.display = 'inline-block';
            } else {
                sampleBadge.style.display = 'none';
            }

            // 마지막 갱신 시간 표시
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            updateTimeEl.textContent = `마지막 갱신 시각: ${timeStr}`;
        }

        // 검색 필터링 및 대여소 목록 렌더링
        function renderStations() {
            const query = searchInput.value.trim().toLowerCase();

            // 검색어 기반 필터링
            const filtered = rawStations.filter(station =>
                station.stationName.toLowerCase().includes(query)
            );

            // 통계 정보 업데이트
            const totalStations = filtered.length;
            const totalBikes = filtered.reduce((acc, cur) => acc + cur.parkingBikeTotCnt, 0);
            const emptyStations = filtered.filter(s => s.parkingBikeTotCnt === 0).length;

            statTotalStations.textContent = totalStations.toLocaleString();
            statTotalBikes.textContent = totalBikes.toLocaleString();
            statEmptyStations.textContent = emptyStations.toLocaleString();

            // 대여소 그리드 비우기
            stationGrid.innerHTML = '';

            if (filtered.length === 0) {
                stationGrid.innerHTML = '<div class="no-result">검색 결과가 없습니다.</div>';
                return;
            }

            // 개별 대여소 엘리먼트 생성
            filtered.forEach(station => {
                const isEmpty = station.parkingBikeTotCnt === 0;

                const card = document.createElement('div');
                card.className = `station-card ${isEmpty ? 'empty' : ''}`;

                // 숫자 색상: 0대는 빨간색, 사용가능한 자전거 수(>0)는 하늘색
                const bikeCntClass = isEmpty ? 'red' : 'cyan';

                card.innerHTML = `
                    <div class="station-name">${escapeHtml(station.stationName)}</div>
                    <div class="station-info">
                        <div class="count-group">
                            <span class="count-label">대여 가능</span>
                            <span class="count-value ${bikeCntClass}">${station.parkingBikeTotCnt}대</span>
                        </div>
                        <div class="meta-group">
                            <span>총 거치대: ${station.rackTotCnt}개</span>
                            <span>거치율: ${station.shared}%</span>
                        </div>
                    </div>
                `;

                stationGrid.appendChild(card);
            });
        }

        // HTML 이스케이프 함수 (보안 강화)
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 이벤트 리스너 등록
        searchInput.addEventListener('input', renderStations);

        btnRefresh.addEventListener('click', () => {
            fetchBikeData();
        });

        // 페이지 로드 시 initial fetch 실행
        window.addEventListener('DOMContentLoaded', () => {
            fetchBikeData();
        });
    </script>
</body>
</html>
